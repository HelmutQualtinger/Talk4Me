<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk4Me</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --text: #1d1d1b; --muted: #77756e;
    --line: #dcdad3; --accent: #2a5bd7; --accent-text: #fff; --sel: #e6ecfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1f2126; --text: #ecebe6; --muted: #8c8a84;
      --line: #33363d; --accent: #6b8fef; --accent-text: #0e1116; --sel: #27304a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  select, input, button { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input { width: 100%; font-size: 18px; }
  input[type=range] { width: 160px; padding: 0; border: 0; background: none; accent-color: var(--accent); }
  button { cursor: pointer; background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.ghost { background: var(--panel); color: var(--text); border-color: var(--line); }
  .grow { flex: 1; min-width: 220px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; background: var(--panel);
       border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  ul:empty { display: none; }
  li { padding: 8px 12px; border-left: 3px solid transparent; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  li + li { border-top: 1px solid var(--line); }
  li.sel { background: var(--sel); border-left-color: var(--accent); font-weight: 600; }
  li small, .muted { color: var(--muted); }
  #out { margin: 16px 0; padding: 12px; border-left: 3px solid var(--accent); min-height: 3em; }
  #out .tr { font-size: 20px; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  h2 { font-size: 14px; color: var(--muted); margin: 24px 0 4px; font-weight: 600; }
  /* Hamburger-Menü: Einstellungen erscheinen nur beim Darüberfahren (oder per Tastatur-Fokus) */
  #menu { position: fixed; top: 12px; left: 12px; z-index: 10; }
  #menu .burger { background: var(--panel); color: var(--text); border-color: var(--line);
    font-size: 20px; line-height: 1; padding: 8px 12px; }
  #menu .settings { display: none; position: absolute; top: 100%; left: 0; padding-top: 8px; }
  #menu:hover .settings, #menu:focus-within .settings { display: block; }
  #menu .box { display: flex; flex-direction: column; gap: 12px; width: 260px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #menu select, #menu input[type=range] { width: 100%; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
  <nav id="menu">
    <button class="burger" aria-label="Einstellungen" aria-haspopup="true">☰</button>
    <div class="settings"><div class="box">
    <label>Eingabesprache
      <select id="src"></select>
    </label>
    <label>Sprechen / übersetzen nach
      <select id="dst"></select>
    </label>
    <label>Deutsch-Variante
      <select id="region">
        <option value="at">Österreich</option>
        <option value="ch">Schweiz</option>
        <option value="de">Deutschland</option>
      </select>
    </label>
    <label>Stimme
      <select id="gender">
        <option value="m">männlich</option>
        <option value="f">weiblich</option>
      </select>
    </label>
    <label><span>Tempo: <span id="rateval"></span></span>
      <input id="rate" type="range" min="80" max="150" step="5" value="100">
    </label>
  
    </div></div>
  </nav>

<main>
  <h1>Talk4Me</h1>

  <div class="row">
    <input id="q" class="grow" type="text" autocomplete="off" autofocus
           placeholder="Satz eintippen …" aria-label="Satz">
    <button id="go">Sprechen</button>
  </div>
  <ul id="sugg" role="listbox"></ul>

  <div id="out"></div>
  <div id="status"></div>
  <div class="hint">Enter: sprechen · ↑/↓: Vorschlag wählen · Tab: Vorschlag übernehmen &amp; sprechen · Esc: Wiedergabe stoppen / Feld leeren</div>

  <h2>Verlauf</h2>
  <ul id="log"></ul>
  <div class="row" style="margin-top:12px">
    <button class="ghost" id="export">Log exportieren</button>
    <button class="ghost" id="clear">Log löschen</button>
  </div>
</main>

<script>
const LANGS = { de: "Deutsch", en: "English", it: "Italiano", fr: "Français" };
const BCP47 = { de: "de-DE", en: "en-US", it: "it-IT", fr: "fr-FR" };
const API = "/api/sentences"; // SQLite-Server: `uv run talk4me serve`
const $ = id => document.getElementById(id);

let log = []; // [{text, lang, first_used, last_used, count}], zuletzt verwendet zuerst
let sugg = [], sel = 0, speaking = 0;

const api = (method, body, url = API) => fetch(url, {
  method, body: body && JSON.stringify(body),
}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r; });
const dbError = () => $("status").textContent =
  "Datenbank nicht erreichbar – Web-UI mit `uv run talk4me serve` starten, sonst wird nichts gespeichert.";

const reload = () => api("GET").then(r => r.json()).then(l => { log = l; renderLog(); refresh(); }).catch(dbError);
reload();

for (const [c, n] of Object.entries(LANGS)) {
  $("src").add(new Option(n, c));
  $("dst").add(new Option(n, c));
}
try {
  $("src").value = localStorage.getItem("talk4me.src") || "de";
  $("dst").value = localStorage.getItem("talk4me.dst") || "en";
  $("gender").value = localStorage.getItem("talk4me.gender") || "m";
  $("region").value = localStorage.getItem("talk4me.region") || "at";
  $("rate").value = localStorage.getItem("talk4me.rate") || "100";
} catch { $("src").value = "de"; $("dst").value = "en"; }
$("rate").oninput = () => $("rateval").textContent = $("rate").value + " %";
$("rate").oninput();
$("src").onchange = $("dst").onchange = $("gender").onchange = $("region").onchange = $("rate").onchange = () => {
  try {
    localStorage.setItem("talk4me.src", $("src").value); localStorage.setItem("talk4me.dst", $("dst").value);
    localStorage.setItem("talk4me.gender", $("gender").value); localStorage.setItem("talk4me.rate", $("rate").value);
    localStorage.setItem("talk4me.region", $("region").value);
  } catch {}
};


// ---------- Übersetzen & Sprechen ----------
// Erst die Datenbank (vorwärts oder rückwärts über den Fremdschlüssel), sonst Google – und Ergebnis speichern
async function translate(text, from, to) {
  if (from === to) return { text };
  const q = new URLSearchParams({ text, from, to });
  const hit = (await fetch("/api/translation?" + q).then(r => r.json()).catch(() => ({}))).text;
  if (hit) return { text: hit, cached: true };
  // inoffizieller, keyloser Google-Endpunkt; Antwort: [[[übersetzt, original, …], …], …]
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${from}&tl=${to}&q=` + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error("Übersetzung fehlgeschlagen (HTTP " + r.status + ")");
  const translation = (await r.json())[0].map(s => s[0]).join("");
  api("POST", { text, to, translation }, "/api/translation").catch(dbError);
  return { text: translation };
}

// Web Speech kennt kein Geschlecht -> bekannte Stimmen nach Namen, bevorzugt in dieser Reihenfolge (m = männlich, f = weiblich).
// Heisere/Spaß-Stimmen (Fred, Ralph, Albert, Bruce, Junior, Whisper, Bad News, Zarvox …) stehen bewusst nicht drin.
// Reed, Eddy, Rocko, Grandpa (m) und Flo, Sandy, Shelley, Grandma (f) sind macOS-Stimmen, die es in vielen Sprachen gibt.
const VOICES = {
  m: {
    de: ["Jonas", "Jan", "Markus", "Viktor", "Martin", "Yannick", "Stefan", "Conrad", "Killian", "Reed", "Eddy", "Rocko", "Grandpa"],
    en: ["Daniel", "Aaron", "Arthur", "Evan", "Nathan", "Gordon", "Oliver", "Guy", "Ryan", "Davis", "George", "Mark", "Reed", "Eddy", "Rocko", "Grandpa"],
    it: ["Luca", "Cosimo", "Diego", "Giorgio", "Reed", "Eddy", "Rocko", "Grandpa"],
    fr: ["Thomas", "Jacques", "Antoine", "Henri", "Paul", "Claude", "Nicolas", "Mathieu", "Reed", "Eddy", "Rocko", "Grandpa"],
  },
  f: {
    de: ["Ingrid", "Leni", "Anna", "Petra", "Helena", "Katja", "Hedda", "Amala", "Flo", "Sandy", "Shelley", "Grandma"],
    en: ["Samantha", "Ava", "Allison", "Susan", "Serena", "Kate", "Karen", "Moira", "Tessa", "Fiona", "Zoe", "Aria", "Jenny", "Flo", "Sandy", "Shelley", "Grandma"],
    it: ["Alice", "Federica", "Paola", "Emma", "Elsa", "Isabella", "Flo", "Sandy", "Shelley", "Grandma"],
    fr: ["Amélie", "Audrey", "Aurélie", "Marie", "Denise", "Julie", "Flo", "Sandy", "Shelley", "Grandma"],
  },
};
const GENDER = { m: "männliche", f: "weibliche" };

function pickVoice(lang) {
  const all = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang));
  // Deutsch: Stimmen der gewählten Variante zuerst (de-AT: Jonas/Ingrid, de-CH: Jan/Leni, jeweils in Edge), sonst alle deutschen
  const pools = lang === "de" ? [all.filter(v => v.lang.replace("_", "-").toLowerCase() === "de-" + $("region").value), all] : [all];
  for (const vs of pools)
    for (const n of VOICES[$("gender").value][lang]) {
      const hits = vs.filter(v => new RegExp(`\\b${n}\\b`, "i").test(v.name));
      // bei mehreren Varianten (Premium/Enhanced/Compact) die hochwertigste nehmen
      const v = hits.find(v => /premium|enhanced|erweitert/i.test(v.name)) || hits[0];
      if (v) return v;
    }
}

function speak(text, lang) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "de" ? "de-" + $("region").value.toUpperCase() : BCP47[lang];
  u.rate = $("rate").value / 100;
  const v = pickVoice(lang);
  if (v) { u.voice = v; u.lang = v.lang; 
    $("status").textContent = "Stimme: " + v.name + (lang === "de" && v.lang.replace("_", "-").toLowerCase() !== "de-" + $("region").value
      ? ` – keine Stimme für ${$("region").selectedOptions[0].text} installiert, deutsche Stimme wird verwendet` : ""); }
  else if (speechSynthesis.getVoices().length)
    $("status").textContent = `Keine ${GENDER[$("gender").value]} ${LANGS[lang]}-Stimme gefunden (gesucht: ${VOICES[$("gender").value][lang].slice(0, 4).join(", ")} …) – Systemstimme wird verwendet.`;
  speechSynthesis.speak(u);
}

async function say(text, from) {
  text = text.trim();
  if (!text) return;
  const to = $("dst").value, id = ++speaking;
  try { await api("POST", { text, lang: from }); reload(); } catch { dbError(); } // Satz muss existieren, bevor die Übersetzung daran hängt
  $("status").textContent = "";
  $("out").innerHTML = "";
  let out = text, cached = false;
  try {
    ({ text: out, cached } = await translate(text, from, to));
  } catch (e) {
    if (id !== speaking) return;
    $("status").textContent = "Fehler: " + e.message + " – spreche Original.";
  }
  if (id !== speaking) return;
  const spokenLang = out === text ? from : to;
  // Gleiche Sprache (oder unverändertes Ergebnis): keine Übersetzung zeigen, nur den gesprochenen Satz
  const translated = from !== to && out !== text;
  $("out").innerHTML = (translated ? `<div class="muted"></div>` : "") + `<div class="tr"></div>`;
  if (translated) $("out").firstChild.textContent = `${LANGS[from]}: ${text}` + (cached ? " · Übersetzung aus der Datenbank" : "");
  $("out").lastChild.textContent = out;
  speak(out, spokenLang);
}

// ---------- UI ----------
function renderList(el, items, selIdx) {
  el.replaceChildren(...items.map((e, i) => {
    const li = document.createElement("li");
    if (i === selIdx) li.className = "sel";
    const a = document.createElement("span"), b = document.createElement("small");
    a.textContent = e.text;
    b.textContent = `${LANGS[e.lang]} · ${e.count}×`;
    li.append(a, b);
    return li;
  }));
}

let req = 0; // nur die jüngste Antwort anzeigen
function refresh() {
  const id = ++req;
  api("GET", null, "/api/suggest?q=" + encodeURIComponent($("q").value)).then(r => r.json()).then(l => {
    if (id !== req) return;
    sugg = l;
    sel = Math.min(sel, Math.max(sugg.length - 1, 0));
    renderList($("sugg"), sugg, sel);
    [...$("sugg").children].forEach((li, i) => li.onclick = () => take(i));
  }).catch(dbError);
}

function renderLog() {
  renderList($("log"), log.slice(0, 15), -1);
  [...$("log").children].forEach((li, i) => li.onclick = () => take(i, log[i]));
}

function take(i, e = sugg[i]) {
  if (!e) return;
  $("q").value = "";
  sel = 0;
  say(e.text, e.lang);
}

$("q").addEventListener("input", () => { sel = 0; refresh(); });
// Tastatur global, damit ↑/↓/Tab auch funktionieren, wenn der Fokus nicht im Eingabefeld liegt
function move(d) {
  sel = Math.min(Math.max(sel + d, 0), sugg.length - 1);
  renderList($("sugg"), sugg, sel);
  $("sugg").children[sel]?.scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "SELECT" || e.target.type === "range" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Tab" && sugg.length) { e.preventDefault(); $("q").focus(); take(sel); }
  else if (e.key === "Enter" && t !== "BUTTON") go();
  else if (e.key === "Escape") { // laufende Wiedergabe stoppen, sonst Feld leeren
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speaking++; // noch ausstehende Übersetzung nicht mehr sprechen
    speechSynthesis.cancel();
    if (!busy) { $("q").value = ""; sel = 0; refresh(); }
  }
  else if (e.key.length === 1 && t !== "INPUT") $("q").focus(); // Tippen landet im Eingabefeld
});

function go() {
  const t = $("q").value;
  $("q").value = "";
  sel = 0;
  say(t, $("src").value);
}
$("go").onclick = () => { go(); $("q").focus(); };

$("clear").onclick = () => { api("DELETE").then(() => { log = []; renderLog(); refresh(); }).catch(dbError); };
$("export").onclick = () => {
  const txt = log.map(e => [e.first_used, e.last_used, e.count, e.lang, e.text].join("\t")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
  a.download = "talk4me-log.tsv";
  a.click();
};

speechSynthesis.onvoiceschanged = () => {}; // Stimmenliste lädt asynchron
</script>
</body>
</html>
