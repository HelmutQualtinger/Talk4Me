<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk4Me</title>
<style>
  :root {
    --paper: #e8edf0; --surface: #f9fbfc; --ink: #18212b; --muted: #62717d; --line: #cfd8de;
    --accent: #0b6e5d; --accent-ink: #fff; --hl: #fdf1a8; --hl-ink: #18212b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10171c; --surface: #18222a; --ink: #e7eef2; --muted: #8a9aa6; --line: #2b3944;
      --accent: #47c9ae; --accent-ink: #06211b; --hl: #3b3813; --hl-ink: #f2ecb8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 10px 16px 32px; }
  h1 { display: flex; align-items: center; min-height: 34px; margin: 0 0 10px; padding-left: 44px;
       font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  @media (min-width: 760px) { h1 { padding-left: 0; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, select, input { font: inherit; color: var(--ink); }
  button { cursor: pointer; }
  kbd { font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; background: var(--surface); color: var(--ink); }

  /* Eingabe */
  .field { display: flex; overflow: hidden; background: var(--surface);
           border: 1.5px solid var(--line); border-radius: 12px; }
  .field:focus-within { border-color: var(--accent); }
  #q { flex: 1; min-width: 0; padding: 10px 14px; border: 0; outline: 0; background: none; font-size: 20px; }
  #go { padding: 0 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* Listen */
  ul { list-style: none; margin: 0; padding: 0; }
  ul:empty { display: none; }
  #sugg, #log { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  #sugg { margin-top: 6px; max-height: 19rem; overflow-y: auto; }
  li { display: flex; align-items: baseline; gap: 10px; padding: 6px 12px; cursor: pointer;
       border-left: 3px solid transparent; }
  li + li { border-top: 1px solid var(--line); }
  li > span { flex: 1; }
  li small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  li.sel { background: var(--hl); color: var(--hl-ink); border-left-color: var(--accent); }
  li.sel small { color: inherit; opacity: .7; }

  /* Ergebnis: der gesprochene Satz, mit Pegelanzeige während der Wiedergabe */
  #card { position: relative; margin-top: 10px; padding: 10px 44px 10px 14px; background: var(--surface);
          border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; }
  #card:has(#out:empty) { display: none; }
  #out .muted { font-size: 13px; color: var(--muted); }
  #out .tr { font-size: 24px; line-height: 1.25; font-weight: 600; }
  .eq { position: absolute; top: 14px; right: 14px; display: flex; align-items: flex-end; gap: 2px;
        height: 18px; opacity: 0; }
  .eq i { width: 3px; height: 45%; border-radius: 2px; background: var(--accent); }
  #card.speaking .eq { opacity: 1; }
  #card.speaking .eq i { animation: eq .9s ease-in-out infinite; }
  #card.speaking .eq i:nth-child(2) { animation-delay: .15s; }
  #card.speaking .eq i:nth-child(3) { animation-delay: .3s; }
  @keyframes eq { 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { #card.speaking .eq i { animation: none; height: 80%; } }
  #status { margin: 6px 2px 0; font-size: 12px; color: var(--muted); }
  #status:empty { display: none; }

  /* Tastenhinweise und Verlauf */
  .keys { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
  details { margin-top: 16px; }
  summary { width: fit-content; cursor: pointer; font-size: 13px; color: var(--muted); }
  details ul { margin-top: 6px; }
  .tools { display: flex; gap: 6px; margin-top: 8px; }
  .tools button { padding: 4px 10px; font-size: 13px; background: var(--surface);
                  border: 1px solid var(--line); border-radius: 8px; }

  /* Hamburger-Menü: Einstellungen erscheinen nur beim Darüberfahren (oder per Tastatur-Fokus) */
  #menu { position: fixed; top: 10px; left: 10px; z-index: 10; }
  #menu .burger { width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1;
                  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  #menu .settings { display: none; position: absolute; top: 100%; left: 0; padding-top: 6px; }
  #menu:hover .settings, #menu:focus-within .settings { display: block; }
  #menu .box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 270px; padding: 12px;
               background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  #menu .wide { grid-column: 1 / -1; }
  #menu label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  #menu select { width: 100%; padding: 5px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  #menu input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
  <nav id="menu">
    <button class="burger" aria-label="Einstellungen" aria-haspopup="true">☰</button>
    <div class="settings"><div class="box">
      <label>Eingabesprache <select id="src"></select></label>
      <label>Sprechen in <select id="dst"></select></label>
      <label>Deutsch-Variante
        <select id="region">
          <option value="at">Österreich</option>
          <option value="ch">Schweiz</option>
          <option value="de">Deutschland</option>
        </select>
      </label>
      <label>Stimme
        <select id="gender">
          <option value="m">männlich</option>
          <option value="f">weiblich</option>
        </select>
      </label>
      <label>Stimme für <select id="vlang"></select></label>
      <label>Konkrete Stimme <span id="vcount"></span>
        <select id="voice"></select>
      </label>
      <label class="wide"><span>Tempo <span id="rateval"></span></span>
        <input id="rate" type="range" min="80" max="150" step="5" value="100">
      </label>
    </div></div>
  </nav>

<main>
  <h1>Talk4Me</h1>

  <div class="field">
    <input id="q" type="text" autocomplete="off" autofocus placeholder="Satz eintippen …" aria-label="Satz">
    <button id="go">Sprechen</button>
  </div>
  <ul id="sugg" role="listbox"></ul>

  <div id="card">
    <div id="out"></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="status"></div>

  <div class="keys">
    <span><kbd>↑</kbd> <kbd>↓</kbd> wählen</span>
    <span><kbd>Tab</kbd> Vorschlag sprechen</span>
    <span><kbd>Enter</kbd> Text sprechen</span>
    <span><kbd>Esc</kbd> stoppen oder leeren</span>
  </div>

  <details>
    <summary>Verlauf (<span id="hcount">0</span>)</summary>
    <ul id="log"></ul>
    <div class="tools">
      <button id="export">Exportieren</button>
      <button id="clear">Log löschen</button>
    </div>
  </details>
</main>

<script>
const LANGS = { de: "Deutsch", en: "English", it: "Italiano", fr: "Français" };
const BCP47 = { de: "de-DE", en: "en-US", it: "it-IT", fr: "fr-FR" };
const API = "/api/sentences"; // SQLite-Server: `uv run talk4me serve`
const $ = id => document.getElementById(id);

let log = []; // [{text, lang, first_used, last_used, count}], zuletzt verwendet zuerst
let sugg = [], sel = 0, speaking = 0;

const api = (method, body, url = API) => fetch(url, {
  method, body: body && JSON.stringify(body),
}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r; });
const dbError = () => $("status").textContent =
  "Datenbank nicht erreichbar – Web-UI mit `uv run talk4me serve` starten, sonst wird nichts gespeichert.";

const reload = () => api("GET").then(r => r.json()).then(l => { log = l; renderLog(); refresh(); }).catch(dbError);
reload();

for (const [c, n] of Object.entries(LANGS)) {
  $("src").add(new Option(n, c));
  $("dst").add(new Option(n, c));
}
try {
  $("src").value = localStorage.getItem("talk4me.src") || "de";
  $("dst").value = localStorage.getItem("talk4me.dst") || "en";
  $("gender").value = localStorage.getItem("talk4me.gender") || "m";
  $("region").value = localStorage.getItem("talk4me.region") || "at";
  $("rate").value = localStorage.getItem("talk4me.rate") || "100";
} catch { $("src").value = "de"; $("dst").value = "en"; }
$("rate").oninput = () => $("rateval").textContent = $("rate").value + " %";
$("rate").oninput();
$("src").onchange = $("dst").onchange = $("gender").onchange = $("region").onchange = $("rate").onchange = () => {
  try {
    localStorage.setItem("talk4me.src", $("src").value); localStorage.setItem("talk4me.dst", $("dst").value);
    localStorage.setItem("talk4me.gender", $("gender").value); localStorage.setItem("talk4me.rate", $("rate").value);
    localStorage.setItem("talk4me.region", $("region").value);
  } catch {}
};


// ---------- Übersetzen & Sprechen ----------
// Erst die Datenbank (vorwärts oder rückwärts über den Fremdschlüssel), sonst Google – und Ergebnis speichern
async function translate(text, from, to) {
  if (from === to) return { text };
  const q = new URLSearchParams({ text, from, to });
  const hit = (await fetch("/api/translation?" + q).then(r => r.json()).catch(() => ({}))).text;
  if (hit) return { text: hit, cached: true };
  // inoffizieller, keyloser Google-Endpunkt; Antwort: [[[übersetzt, original, …], …], …]
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${from}&tl=${to}&q=` + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error("Übersetzung fehlgeschlagen (HTTP " + r.status + ")");
  const translation = (await r.json())[0].map(s => s[0]).join("");
  api("POST", { text, to, translation }, "/api/translation").catch(dbError);
  return { text: translation };
}

// Web Speech kennt kein Geschlecht -> bekannte Stimmen nach Namen, bevorzugt in dieser Reihenfolge (m = männlich, f = weiblich).
// Heisere/Spaß-Stimmen (Fred, Ralph, Albert, Bruce, Junior, Whisper, Bad News, Zarvox …) stehen bewusst nicht drin.
// Reed, Eddy, Rocko, Grandpa (m) und Flo, Sandy, Shelley, Grandma (f) sind macOS-Stimmen, die es in vielen Sprachen gibt.
const VOICES = {
  m: {
    de: ["Jonas", "Jan", "Markus", "Viktor", "Martin", "Yannick", "Stefan", "Conrad", "Killian", "Reed", "Eddy", "Rocko", "Grandpa"],
    en: ["Daniel", "Aaron", "Arthur", "Evan", "Nathan", "Gordon", "Oliver", "Guy", "Ryan", "Davis", "George", "Mark", "Reed", "Eddy", "Rocko", "Grandpa"],
    it: ["Luca", "Cosimo", "Diego", "Giorgio", "Reed", "Eddy", "Rocko", "Grandpa"],
    fr: ["Thomas", "Jacques", "Antoine", "Henri", "Paul", "Claude", "Nicolas", "Mathieu", "Reed", "Eddy", "Rocko", "Grandpa"],
  },
  f: {
    de: ["Ingrid", "Leni", "Anna", "Petra", "Helena", "Katja", "Hedda", "Amala", "Flo", "Sandy", "Shelley", "Grandma"],
    en: ["Samantha", "Ava", "Allison", "Susan", "Serena", "Kate", "Karen", "Moira", "Tessa", "Fiona", "Zoe", "Aria", "Jenny", "Flo", "Sandy", "Shelley", "Grandma"],
    it: ["Alice", "Federica", "Paola", "Emma", "Elsa", "Isabella", "Flo", "Sandy", "Shelley", "Grandma"],
    fr: ["Amélie", "Audrey", "Aurélie", "Marie", "Denise", "Julie", "Flo", "Sandy", "Shelley", "Grandma"],
  },
};
const GENDER = { m: "männliche", f: "weibliche" };

function pickVoice(lang) {
  const chosen = speechSynthesis.getVoices().find(v => v.voiceURI === voiceChoice[lang]);
  if (chosen) return chosen;
  const all = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang));
  // Deutsch: Stimmen der gewählten Variante zuerst (de-AT: Jonas/Ingrid, de-CH: Jan/Leni, jeweils in Edge), sonst alle deutschen
  const pools = lang === "de" ? [all.filter(v => v.lang.replace("_", "-").toLowerCase() === "de-" + $("region").value), all] : [all];
  for (const vs of pools)
    for (const n of VOICES[$("gender").value][lang]) {
      const hits = vs.filter(v => new RegExp(`\\b${n}\\b`, "i").test(v.name));
      // bei mehreren Varianten (Premium/Enhanced/Compact) die hochwertigste nehmen
      const v = hits.find(v => /premium|enhanced|erweitert/i.test(v.name)) || hits[0];
      if (v) return v;
    }
}

let current = null;
function speak(text, lang) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "de" ? "de-" + $("region").value.toUpperCase() : BCP47[lang];
  u.rate = $("rate").value / 100;
  const v = pickVoice(lang);
  if (v) { u.voice = v; u.lang = v.lang; 
    $("status").textContent = "Stimme: " + v.name + (lang === "de" && v.lang.replace("_", "-").toLowerCase() !== "de-" + $("region").value
      ? ` – keine Stimme für ${$("region").selectedOptions[0].text} installiert, deutsche Stimme wird verwendet` : ""); }
  else if (speechSynthesis.getVoices().length)
    $("status").textContent = `Keine ${GENDER[$("gender").value]} ${LANGS[lang]}-Stimme gefunden (gesucht: ${VOICES[$("gender").value][lang].slice(0, 4).join(", ")} …) – Systemstimme wird verwendet.`;
  current = u; // Pegelanzeige nur für die jüngste Ausgabe (cancel() meldet die alte verspätet als beendet)
  u.onstart = () => current === u && $("card").classList.add("speaking");
  u.onend = u.onerror = () => current === u && $("card").classList.remove("speaking");
  speechSynthesis.speak(u);
}

async function say(text, from) {
  text = text.trim();
  if (!text) return;
  const to = $("dst").value, id = ++speaking;
  try { await api("POST", { text, lang: from }); reload(); } catch { dbError(); } // Satz muss existieren, bevor die Übersetzung daran hängt
  $("status").textContent = "";
  $("out").innerHTML = "";
  let out = text, cached = false;
  try {
    ({ text: out, cached } = await translate(text, from, to));
  } catch (e) {
    if (id !== speaking) return;
    $("status").textContent = "Fehler: " + e.message + " – spreche Original.";
  }
  if (id !== speaking) return;
  const spokenLang = out === text ? from : to;
  // Gleiche Sprache (oder unverändertes Ergebnis): keine Übersetzung zeigen, nur den gesprochenen Satz
  const translated = from !== to && out !== text;
  $("out").innerHTML = (translated ? `<div class="muted"></div>` : "") + `<div class="tr"></div>`;
  if (translated) $("out").firstChild.textContent = `${LANGS[from]}: ${text}` + (cached ? " · Übersetzung aus der Datenbank" : "");
  $("out").lastChild.textContent = out;
  speak(out, spokenLang);
}

// ---------- UI ----------
function renderList(el, items, selIdx) {
  el.replaceChildren(...items.map((e, i) => {
    const li = document.createElement("li");
    if (i === selIdx) li.className = "sel";
    const a = document.createElement("span"), b = document.createElement("small");
    a.textContent = e.text;
    b.textContent = (e.via ? `≈ ${e.via} · ` : "") + `${e.lang} ${e.count}×`;
    li.append(a, b);
    if (i === selIdx) li.append(Object.assign(document.createElement("kbd"), { textContent: "Tab" }));
    return li;
  }));
}

let req = 0; // nur die jüngste Antwort anzeigen
function refresh() {
  const id = ++req;
  api("GET", null, "/api/suggest?q=" + encodeURIComponent($("q").value)).then(r => r.json()).then(l => {
    if (id !== req) return;
    sugg = l;
    sel = Math.min(sel, Math.max(sugg.length - 1, 0));
    renderList($("sugg"), sugg, sel);
    [...$("sugg").children].forEach((li, i) => li.onclick = () => take(i));
  }).catch(dbError);
}

function renderLog() {
  $("hcount").textContent = log.length;
  renderList($("log"), log.slice(0, 15), -1);
  [...$("log").children].forEach((li, i) => li.onclick = () => take(i, log[i]));
}

function take(i, e = sugg[i]) {
  if (!e) return;
  $("q").value = "";
  sel = 0;
  say(e.text, e.lang);
}

$("q").addEventListener("input", () => { sel = 0; refresh(); });
// Tastatur global, damit ↑/↓/Tab auch funktionieren, wenn der Fokus nicht im Eingabefeld liegt
function move(d) {
  sel = Math.min(Math.max(sel + d, 0), sugg.length - 1);
  renderList($("sugg"), sugg, sel);
  $("sugg").children[sel]?.scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "SELECT" || e.target.type === "range" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Tab" && sugg.length) { e.preventDefault(); $("q").focus(); take(sel); }
  else if (e.key === "Enter" && t !== "BUTTON") go();
  else if (e.key === "Escape") { // laufende Wiedergabe stoppen, sonst Feld leeren
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speaking++; // noch ausstehende Übersetzung nicht mehr sprechen
    speechSynthesis.cancel();
    if (!busy) { $("q").value = ""; sel = 0; refresh(); }
  }
  else if (e.key.length === 1 && t !== "INPUT") $("q").focus(); // Tippen landet im Eingabefeld
});

function go() {
  const t = $("q").value;
  $("q").value = "";
  sel = 0;
  say(t, $("src").value);
}
$("go").onclick = () => { go(); $("q").focus(); };

$("clear").onclick = () => { api("DELETE").then(() => { log = []; renderLog(); refresh(); }).catch(dbError); };
$("export").onclick = () => {
  const txt = log.map(e => [e.first_used, e.last_used, e.count, e.lang, e.text].join("\t")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
  a.download = "talk4me-log.tsv";
  a.click();
};

// Stimmenwahl je Zielsprache: erst Sprache, dann die dazu gefundenen Stimmen
let voiceChoice = {};
try { voiceChoice = JSON.parse(localStorage.getItem("talk4me.voices")) || {}; } catch {}
for (const [c, n] of Object.entries(LANGS)) $("vlang").add(new Option(n, c));
$("vlang").value = $("dst").value;
function fillVoices() {
  const l = $("vlang").value, sel = $("voice");
  const vs = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(l))
    .sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
  sel.length = 0;
  sel.add(new Option("Automatisch (nach Geschlecht)", ""));
  for (const v of vs) sel.add(new Option(`${v.name} (${v.lang})`, v.voiceURI));
  sel.value = voiceChoice[l] || ""; if (sel.value !== (voiceChoice[l] || "")) sel.value = "";
  $("vcount").textContent = `(${vs.length} gefunden)`;
}
$("vlang").onchange = fillVoices;
$("voice").onchange = () => {
  voiceChoice[$("vlang").value] = $("voice").value;
  try { localStorage.setItem("talk4me.voices", JSON.stringify(voiceChoice)); } catch {}
};
speechSynthesis.onvoiceschanged = fillVoices; // Stimmenliste lädt asynchron
fillVoices();
</script>
</body>
</html>
