<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk4Me</title>
<meta name="description" content="Tippen, übersetzen, sprechen lassen. Selbst hostbar, Sätze bleiben in der eigenen Datenbank.">
<meta property="og:type" content="website">
<meta property="og:title" content="Talk4Me">
<meta property="og:description" content="Tippen, übersetzen, sprechen lassen. Selbst hostbar, Sätze bleiben in der eigenen Datenbank.">
<meta property="og:image" content="https://raw.githubusercontent.com/HelmutQualtinger/Talk4Me/main/docs/social-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raw.githubusercontent.com/HelmutQualtinger/Talk4Me/main/docs/social-preview.png">
<style>
  :root {
    --paper: #e8edf0; --surface: #f9fbfc; --ink: #18212b; --muted: #62717d; --line: #cfd8de;
    --accent: #0b6e5d; --accent-ink: #fff; --hl: #fdf1a8; --hl-ink: #18212b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10171c; --surface: #18222a; --ink: #e7eef2; --muted: #8a9aa6; --line: #2b3944;
      --accent: #47c9ae; --accent-ink: #06211b; --hl: #3b3813; --hl-ink: #f2ecb8;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10171c; --surface: #18222a; --ink: #e7eef2; --muted: #8a9aa6; --line: #2b3944;
    --accent: #47c9ae; --accent-ink: #06211b; --hl: #3b3813; --hl-ink: #f2ecb8;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 10px 16px 32px; }
  .top { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; justify-self: end; }
  .look { display: flex; align-items: center; gap: 6px; }
  .rate { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 400; color: var(--muted); }
  .rate input { width: 90px; accent-color: var(--accent); }
  #whotop { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 400; color: var(--muted); }
  @media (max-width: 559px) { #whotop { max-width: 110px; } }
  .theme { width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1; background: none;
                          border: 1.5px solid transparent; border-radius: 8px; }
  .theme { border-color: var(--line) !important; background: var(--surface) !important; }
  #pk-emo .pkmenu, #pk-voice .pkmenu, #pk-ui .pkmenu { max-height: 60vh; overflow-y: auto; white-space: nowrap; }
  #pk-emo .pkmenu, #pk-voice .pkmenu { left: auto; right: 0; transform: none; }
  #pk-ui .pkmenu { left: auto; right: 0; transform: none; }
  .flag { display: block; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128,128,128,.45); }
  h1 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 34px; margin: 0 0 10px; padding-left: 44px;
       font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  @media (min-width: 760px) { h1 { padding-left: 0; } }
  @media (max-width: 559px) { h1 { grid-template-columns: 1fr auto; row-gap: 6px; }
                              .pair { grid-row: 2; grid-column: 1 / -1; justify-self: center; } }
  /* Ursprungs- und Zielsprache: zwei Flaggen, jede ein Auswahlmenü */
  .pair { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  .picker { position: relative; }
  .pk { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; background: var(--surface);
        border: 1.5px solid var(--line); border-radius: 8px; font-size: 11px; color: var(--muted); }
  .pk svg.flag { width: 28px; height: auto; }
  .pkmenu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); z-index: 15; margin-top: 4px; padding: 4px;
            min-width: 150px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .pkmenu[hidden] { display: none; }
  .pkmenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; background: none;
                   border: 0; border-radius: 6px; font-size: 14px; text-align: left; }
  .pkmenu button:hover, .pkmenu button[aria-selected="true"] { background: var(--hl); color: var(--hl-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, select, input { font: inherit; color: var(--ink); }
  button { cursor: pointer; }
  kbd { font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; background: var(--surface); color: var(--ink); }

  /* Eingabe */
  .field { display: flex; overflow: hidden; background: var(--surface);
           border: 1.5px solid var(--line); border-radius: 12px; }
  .field:focus-within { border-color: var(--accent); }
  #q { flex: 1; min-width: 0; padding: 10px 14px; border: 0; outline: 0; background: none; font-size: 20px; }
  #go { padding: 0 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* Listen */
  ul { list-style: none; margin: 0; padding: 0; }
  ul:empty { display: none; }
  #sugg, #log { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  #sugg { margin-top: 6px; max-height: 19rem; overflow-y: auto; }
  li { display: flex; align-items: baseline; gap: 10px; padding: 6px 12px; cursor: pointer;
       border-left: 3px solid transparent; }
  li + li { border-top: 1px solid var(--line); }
  li > span { flex: 1; }
  li small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  li.sel { background: var(--hl); color: var(--hl-ink); border-left-color: var(--accent); }
  li .del { flex: none; width: 22px; height: 22px; padding: 0; font-size: 16px; line-height: 1; color: var(--muted);
            background: none; border: 0; border-radius: 6px; opacity: .55; }
  li .del:hover, li .del:focus-visible { opacity: 1; color: #c0392b; background: var(--paper); }
  li.sel small { color: inherit; opacity: .7; }

  /* Ergebnis: der gesprochene Satz, mit Pegelanzeige während der Wiedergabe */
  #card { position: relative; margin-top: 10px; padding: 10px 44px 10px 14px; background: var(--surface);
          border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; }
  #card:has(#out:empty) { display: none; }
  #out .muted { font-size: 13px; color: var(--muted); }
  #out .romaji { font-size: 15px; font-style: italic; color: var(--muted); }
  #out .tr { font-size: 24px; line-height: 1.25; font-weight: 600; }
  .eq { position: absolute; top: 14px; right: 14px; display: flex; align-items: flex-end; gap: 2px;
        height: 18px; opacity: 0; }
  .eq i { width: 3px; height: 45%; border-radius: 2px; background: var(--accent); }
  #card.speaking .eq { opacity: 1; }
  #card.speaking .eq i { animation: eq .9s ease-in-out infinite; }
  #card.speaking .eq i:nth-child(2) { animation-delay: .15s; }
  #card.speaking .eq i:nth-child(3) { animation-delay: .3s; }
  @keyframes eq { 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { #card.speaking .eq i { animation: none; height: 80%; } }
  /* Sprechblase: der gesprochene Satz, solange gesprochen wird */
  #bubble { position: fixed; right: 16px; top: 16px; z-index: 20; max-width: min(420px, calc(100vw - 32px));
            padding: 12px 18px; font-size: 22px; line-height: 1.3; font-weight: 600; text-align: left;
            background: var(--surface); color: inherit; border: 2px solid var(--accent); border-radius: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,.25); pointer-events: none;
            opacity: 0; transform: translateY(-10px); transition: opacity .2s, transform .2s; }
  #bubble.show { opacity: 1; transform: none; }
  #bubble::after { content: ""; position: absolute; right: 22px; bottom: 100%; width: 16px; height: 16px; margin-bottom: -9px;
                   background: var(--surface); border: solid var(--accent); border-width: 2px 0 0 2px; transform: rotate(45deg); }
  @media (prefers-reduced-motion: reduce) { #bubble { transition: none; } }
  #status { margin: 6px 2px 0; font-size: 12px; color: var(--muted); }
  #status:empty { display: none; }

  /* Tastenhinweise und Verlauf */
  .about { margin: 16px 2px 0; font-size: 12px; color: var(--muted); }
  .about a { color: inherit; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
  details { margin-top: 16px; }
  summary { width: fit-content; cursor: pointer; font-size: 13px; color: var(--muted); }
  details ul { margin-top: 6px; }
  .helpbar { display: flex; gap: 6px; margin-top: 8px; }
  .helpbar button { width: 36px; height: 30px; padding: 0; font-size: 16px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 8px; }
  #helptext p { margin: 8px 2px 0; font-size: 13px; line-height: 1.45; }
  #helptext p.now { background: var(--hl); color: var(--hl-ink); border-radius: 6px; }
  /* Anmeldung */
  #auth { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--paper); overflow: auto; }
  #auth[hidden] { display: none; }
  #authform { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); padding: 20px; background: var(--surface);
              border: 1px solid var(--line); border-radius: 12px; }
  #authform h2 { margin: 0; font-size: 18px; }
  #authform p { margin: 0; font-size: 13px; color: var(--muted); }
  #authform input, #authform select { padding: 10px 12px; font-size: 16px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px; }
  #authform input:focus { border-color: var(--accent); outline: 0; }
  #authform input[hidden], #authform p[hidden] { display: none; }
  #asubmit { padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; }
  #amsg { min-height: 1.2em; font-size: 13px; color: #c0392b; }
  #amsg.ok { color: var(--accent); }
  .alinks { display: flex; flex-direction: column; gap: 4px; }
  .alinks a { color: var(--muted); font-size: 13px; }
  .alinks a[hidden] { display: none; }
  #acct { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  #acct button { padding: 3px 8px; font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  .tools { display: flex; gap: 6px; margin-top: 8px; }
  .tools button { padding: 4px 10px; font-size: 13px; background: var(--surface);
                  border: 1px solid var(--line); border-radius: 8px; }

  /* Hamburger-Menü: Einstellungen erscheinen nur beim Darüberfahren (oder per Tastatur-Fokus) */
  #menu { position: fixed; top: 10px; left: 10px; z-index: 10; }
  #menu .burger { width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1;
                  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  #menu .settings { display: none; position: absolute; top: 100%; left: 0; padding-top: 6px; }
  #menu:hover .settings, #menu:focus-within .settings { display: block; }
  #menu .box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 270px; padding: 12px;
               background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  #menu .wide { grid-column: 1 / -1; }
  #menu label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  #menu select { width: 100%; padding: 5px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  #menu input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
  <div id="auth" hidden>
  <form id="authform" novalidate>
    <select id="alang" aria-label="Language"></select>
    <h2 id="atitle"></h2>
    <p id="aintro"></p>
    <input id="aemail" type="email" autocomplete="username" required>
    <input id="apw" type="password" autocomplete="current-password" minlength="8">
    <input id="apw2" type="password" autocomplete="new-password" minlength="8">
    <button id="asubmit" type="submit"></button>
    <div id="amsg" role="alert"></div>
    <p class="alinks"><a href="#" id="alink1"></a><a href="#" id="alink2"></a></p>
  </form>
</div>
  <div id="bubble" role="status" aria-live="polite"></div>
  <nav id="menu">
    <button class="burger" data-i18n-aria="settings" aria-haspopup="true">☰</button>
    <div class="settings"><div class="box">
      <select id="src" hidden></select><select id="dst" hidden></select>
      <label><span data-i18n="region"></span>
        <select id="region">
          <option value="at" data-i18n="at"></option>
          <option value="ch" data-i18n="ch"></option>
          <option value="de" data-i18n="de"></option>
        </select>
      </label>
      <div class="wide" id="acct" hidden><span id="who"></span> <button id="logout" type="button" data-i18n="logout"></button></div>
      <label><span data-i18n="voice"></span>
        <select id="gender">
          <option value="m" data-i18n="male"></option>
          <option value="f" data-i18n="female"></option>
        </select>
      </label>
      <label><span data-i18n="voicefor"></span> <select id="vlang"></select></label>
      <label><span data-i18n="concrete"></span> <span id="vcount"></span>
        <select id="voice"></select>
      </label>
    </div></div>
  </nav>

<main>
  <h1><span>Talk4Me</span>
    <span class="pair"><span class="picker" id="pk-src"></span><span aria-hidden="true">→</span><span class="picker" id="pk-dst"></span></span>
    <span class="top">
      <span class="look">
        <span class="picker" id="pk-emo" hidden></span><span class="picker" id="pk-voice"></span><span class="picker" id="pk-ui"></span>
        <button class="theme" id="theme" type="button"></button>
        <span id="whotop" hidden></span>
        <button class="theme" id="logouttop" type="button" hidden>⏻</button>
      </span>
      <label class="rate"><span><span data-i18n="rate"></span> <span id="rateval"></span></span>
        <input id="rate" type="range" min="80" max="150" step="5" value="100">
      </label>
    </span>
  </h1>

  <div class="field">
    <input id="q" type="text" autocomplete="off" autofocus data-i18n-ph="ph" data-i18n-aria="sentence">
    <button id="go" data-i18n="speak"></button>
  </div>
  <ul id="sugg" role="listbox"></ul>

  <div id="card">
    <div id="out"></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="status"></div>

  <div class="keys">
    <span><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="k_sel"></span></span>
    <span><kbd>Tab</kbd> <span data-i18n="k_tab1"></span>, <kbd>Tab</kbd><kbd>Tab</kbd> <span data-i18n="k_tab2"></span></span>
    <span><kbd>Enter</kbd> <span data-i18n="k_enter"></span></span>
    <span><kbd>Esc</kbd> <span data-i18n="k_esc"></span></span>
  </div>

  <details>
    <summary><span data-i18n="history"></span> (<span id="hcount">0</span>)</summary>
    <ul id="log"></ul>
    <div class="tools">
      <button id="export" data-i18n="export"></button>
      <button id="clear" data-i18n="clear"></button>
    </div>
  </details>

  <details id="help">
    <summary><span data-i18n="help"></span></summary>
    <div class="helpbar">
      <button id="hspeak" type="button">🔊</button>
      <button id="hstop" type="button" hidden>⏹</button>
    </div>
    <div id="helptext"></div>
  </details>

  <p class="about" data-i18n-html="about"></p>
</main>

<script>
const LANGS = { de: "Deutsch", en: "English", it: "Italiano", fr: "Français", hu: "Magyar", ja: "日本語", es: "Español", ru: "Русский", zh: "中文" };
const BCP47 = { de: "de-DE", en: "en-US", it: "it-IT", fr: "fr-FR", hu: "hu-HU", ja: "ja-JP", es: "es-ES", ru: "ru-RU", zh: "zh-CN" };
const GTX = { zh: "zh-CN" }; // Google-Sprachcode, wo er vom Schlüssel abweicht
const FLAGS = {
  es: `<rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/>`,
  ru: `<rect width="60" height="13.4" fill="#fff"/><rect y="13.33" width="60" height="13.4" fill="#0039a6"/><rect y="26.67" width="60" height="13.4" fill="#d52b1e"/>`,
  zh: `<rect width="60" height="40" fill="#de2910"/><path d="M10 4l2.4 7.4h7.8l-6.3 4.6 2.4 7.4-6.3-4.6-6.3 4.6 2.4-7.4-6.3-4.6h7.8z" fill="#ffde00"/>`,
  ja: `<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="12" fill="#bc002d"/>`,
  de: `<rect y="0.00" width="60" height="13.4" fill="#000"/><rect y="13.33" width="60" height="13.4" fill="#d00"/><rect y="26.67" width="60" height="13.4" fill="#ffce00"/>`,
  en: `<rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="7"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="12"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="7"/>`,
  it: `<rect x="0" width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ce2b37"/>`,
  fr: `<rect x="0" width="20" height="40" fill="#0055a4"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ef4135"/>`,
  hu: `<rect y="0.00" width="60" height="13.4" fill="#cd2a3e"/><rect y="13.33" width="60" height="13.4" fill="#fff"/><rect y="26.67" width="60" height="13.4" fill="#436f4d"/>`,
};
const flagSvg = c => `<svg class="flag" viewBox="0 0 60 40" width="24" height="16" aria-hidden="true">${FLAGS[c]}</svg>`;
const GH = "https://github.com/HelmutQualtinger/Talk4Me";
const link = t => `<a href="${GH}" target="_blank" rel="noopener">${t}</a>`;
// Oberflächentexte je Sprache; {0}, {1} … sind Platzhalter
const I18N = {
  de: { delete: "Nachricht löschen", settings: "Einstellungen", uilang: "Sprache der Oberfläche", theme_light: "Zum hellen Design wechseln", theme_dark: "Zum dunklen Design wechseln",
    src: "Eingabesprache", dst: "Sprechen in", region: "Deutsch-Variante", at: "Österreich", ch: "Schweiz", de: "Deutschland",
    voice: "Stimme", male: "männlich", female: "weiblich", voicefor: "Stimme für", concrete: "Konkrete Stimme", found: "({0} gefunden)", auto: "Automatisch (nach Geschlecht)",
    rate: "Tempo", ph: "Satz eintippen …", sentence: "Satz", speak: "Sprechen",
    k_sel: "wählen", k_tab1: "Vorschlag übernehmen", k_tab2: "sprechen", k_enter: "Text sprechen", k_esc: "stoppen oder leeren",
    history: "Verlauf", export: "Exportieren", clear: "Alle Nachrichten löschen", confirm_clear: "Wirklich alle Nachrichten und alle gespeicherten Übersetzungen aus der Datenbank löschen? Das lässt sich nicht rückgängig machen.",
    about: `Empfehlung: Am besten auf dem eigenen Rechner installieren (Anleitung auf ${link("GitHub")}). Dann liegen Sätze und Übersetzungen nur in der eigenen Datenbank, ohne Konto und Tracking. Nur zum Übersetzen geht ein Satz an Google Translate (außer er ist schon in der Datenbank).`,
    dberr: "Datenbank nicht erreichbar – Web-UI mit `uv run talk4me serve` starten, sonst wird nichts gespeichert.",
    voiceis: "Stimme: {0}", noregion: " – keine Stimme für {0} installiert, deutsche Stimme wird verwendet",
    novoice: "Keine {0}-Stimme installiert – es wird die Systemstimme verwendet, die Aussprache kann falsch klingen.",
    transfail: "Übersetzung fehlgeschlagen (HTTP {0})", error: "Fehler: {0} – spreche Original.", orig: "Original", cached: " · Übersetzung aus der Datenbank" },
  en: { delete: "Delete message", settings: "Settings", uilang: "Interface language", theme_light: "Switch to light theme", theme_dark: "Switch to dark theme",
    src: "Input language", dst: "Speak in", region: "German variant", at: "Austria", ch: "Switzerland", de: "Germany",
    voice: "Voice", male: "male", female: "female", voicefor: "Voice for", concrete: "Specific voice", found: "({0} found)", auto: "Automatic (by gender)",
    rate: "Speed", ph: "Type a sentence …", sentence: "Sentence", speak: "Speak",
    k_sel: "select", k_tab1: "use suggestion", k_tab2: "speak", k_enter: "speak text", k_esc: "stop or clear",
    history: "History", export: "Export", clear: "Delete all messages", confirm_clear: "Really delete all messages and all stored translations from the database? This cannot be undone.",
    about: `Recommended: install it on your own computer (instructions on ${link("GitHub")}). Then sentences and translations stay in your own database, with no account and no tracking. Only for translating, a sentence is sent to Google Translate (unless it is already in the database).`,
    dberr: "Database not reachable – start the web UI with `uv run talk4me serve`, otherwise nothing is saved.",
    voiceis: "Voice: {0}", noregion: " – no voice for {0} installed, using a German voice",
    novoice: "No {0} voice installed – using the system voice, pronunciation may sound wrong.",

// ---------- Übersetzen & Sprechen ----------
// Erst die Datenbank (vorwärts oder rückwärts über den Fremdschlüssel), sonst Google – und Ergebnis speichern
async function translate(text, from, to) {
  const q = new URLSearchParams({ text, from, to });
  const hit = (await fetch("/api/translation?" + q).then(r => r.json()).catch(() => ({}))).text;
  if (hit) return { text: hit, cached: true };
  // inoffizieller, keyloser Google-Endpunkt; Antwort: [[[übersetzt, original, …], …], …]
  // Gleiche Sprache: Umweg über eine Zwischensprache (Hin- und Rückübersetzung), das glättet die Grammatik
  const gtx = async (t, sl, tl) => {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${GTX[sl] || sl}&tl=${GTX[tl] || tl}&q=` + encodeURIComponent(t));
    if (!r.ok) throw new Error(t("transfail", r.status));
    return (await r.json())[0].map(s => s[0]).join("");
  };
  const pivot = from === "en" ? "de" : "en";
  const translation = from === to ? await gtx(await gtx(text, from, pivot), pivot, to) : await gtx(text, from, to);
  api("POST", { text, to, translation }, "/api/translation").then(reload).catch(dbError); // neu geladen, damit die Suche die Übersetzung findet
  return { text: translation };
}

// Lateinische Umschrift (Rōmaji) eines japanischen Textes: Google liefert sie mit dt=rm als Lesung des Quelltexts
// (letzter Eintrag der Antwort: [null, null, Umschrift der Übersetzung, Umschrift des Originals]). Fehlt sie, kommt "".
const ROMAN = new Set(["ja", "ru", "zh"]); // Sprachen mit Umschrift (Rōmaji, Latinisierung, Pinyin)
async function romaji(text, lang = "ja") {
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=rm&sl=${GTX[lang] || lang}&tl=en&q=` + encodeURIComponent(text));
    if (!r.ok) return "";
    return (await r.json())[0].map(e => typeof e[3] === "string" ? e[3] : "").join(" ").trim();
  } catch { return ""; }
}

// Stimmen einer Sprache, ohne die schlecht klingenden Allsprachen-Stimmen von macOS – es sei denn, es gibt in der Sprache keine anderen
const generic = v => /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley?)\b/i.test(v.name);
function voicesFor(lang) {
  const inLang = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().split("-")[0] === lang);
  return inLang.some(v => !generic(v)) ? inLang.filter(v => !generic(v)) : inLang;
}
function pickVoice(lang) {
  const chosen = speechSynthesis.getVoices().find(v => v.voiceURI === voiceChoice[lang]);
  if (chosen) return chosen;
  const all = voicesFor(lang);
  // Deutsch: Stimmen der gewählten Variante zuerst (de-AT: Jonas/Ingrid, de-CH: Jan/Leni, jeweils in Edge), sonst alle deutschen
  const pools = lang === "de" ? [all.filter(v => v.lang.replace("_", "-").toLowerCase() === "de-" + $("region").value), all] : [all];
  for (const vs of pools)
    for (const n of VOICES[$("gender").value][lang]) {
      const hits = vs.filter(v => new RegExp(`\\b${n}\\b`, "i").test(v.name));
      // bei mehreren Varianten (Premium/Enhanced/Compact) die hochwertigste nehmen
      const v = hits.find(v => /premium|enhanced|erweitert/i.test(v.name)) || hits[0];
      if (v) return v;
    }
  // keine Namenstreffer: trotzdem eine Stimme der Zielsprache (lieber lokal), nie eine fremdsprachige
  return all.find(v => v.localService) || all[0];
}

let current = null, bubbleTimer;
function bubble(on) { // Sprechblase an/aus; spätestens nach 10 s verschwindet sie auch bei laufender Ausgabe
  clearTimeout(bubbleTimer);
  $("bubble").classList.toggle("show", on);
  if (on) bubbleTimer = setTimeout(() => bubble(false), 10000);
}
// Piper-Stimmen des Servers ({lang: [m, f]}, leer ohne Piper): bevorzugt, solange keine konkrete Browser-Stimme gewählt ist
let piper = {}, audio = null;
fetch("/api/tts/voices").then(r => r.json()).then(v => { piper = v; fillVoices(); }).catch(() => {});
const stopAudio = () => { if (audio) { const a = audio; audio = null; a.pause(); a.dispatchEvent(new Event("ended")); } };
function speakPiper(text, lang) {
  const g = $("gender").value, have = piper[lang];
  const p = { text, lang, gender: g, rate: $("rate").value / 100 };
  if (emotionOn(lang)) p.emotion = emotion;
  const a = audio = new Audio("/api/tts?" + new URLSearchParams(p));
  $("status").textContent = t("voiceis", "Piper (" + (have.includes(g) ? have : have[0]) + ")");
  $("bubble").textContent = text;
  const done = () => { if (audio === a || !audio) audio = null; $("card").classList.remove("speaking"); bubble(false); };
  a.onplaying = () => ($("card").classList.add("speaking"), bubble(true));
  a.onended = a.onerror = done;
  a.play().catch(() => { done(); speakBrowser(text, lang); });
}
let lastSpoken = null, lastSaid = null; // lastSaid: {text, from} der zuletzt eingegebene Satz; {text, lang} der letzten Ausgabe, für die Wiederholung nach einem Stimmwechsel
// Emotionen der deutschen Piper-Männerstimme (Thorsten emotional): Sprechername -> Emoticon
const EMOTIONS = { neutral: "😐", amused: "😄", angry: "😠", disgusted: "🤢", drunk: "🥴", sleepy: "😴", surprised: "😮", whisper: "🤫" };
let emotion = "neutral";
try { emotion = localStorage.getItem("talk4me.emotion") in EMOTIONS ? localStorage.getItem("talk4me.emotion") : "neutral"; } catch {}
function emotionOn(lang) { // gilt nur, wenn Piper die deutsche Männerstimme spricht
  const have = piper.de, g = $("gender").value;
  return lang === "de" && !!have && !voiceChoice.de && (have.includes(g) ? g : have[0]) === "m";
}
function speak(text, lang) {
  lastSpoken = { text, lang };
  helpStop(); // laufendes Vorlesen der Anleitung beenden
  speechSynthesis.cancel();
  stopAudio();
  if (piper[lang] && !voiceChoice[lang]) return speakPiper(text, lang);
  speakBrowser(text, lang);
}
function speakBrowser(text, lang) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "de" ? "de-" + $("region").value.toUpperCase() : BCP47[lang];
  u.rate = $("rate").value / 100;
  const v = pickVoice(lang);
  if (v) { u.voice = v; u.lang = v.lang; 
    $("status").textContent = t("voiceis", v.name) + (lang === "de" && v.lang.replace("_", "-").toLowerCase() !== "de-" + $("region").value
      ? t("noregion", $("region").selectedOptions[0].text) : ""); }
  else if (speechSynthesis.getVoices().length)
    $("status").textContent = t("novoice", LANGS[lang]);
  current = u; // Pegelanzeige nur für die jüngste Ausgabe (cancel() meldet die alte verspätet als beendet)
  $("bubble").textContent = text;
  u.onstart = () => current === u && ($("card").classList.add("speaking"), bubble(true));
  u.onend = u.onerror = () => current === u && ($("card").classList.remove("speaking"), bubble(false));
  speechSynthesis.speak(u);
}

// Gesprochenen Text in die Zwischenablage des Geräts legen (braucht https oder localhost; scheitert still, wenn der Browser es verweigert)
function copyText(text) {
  const fallback = () => { // ältere Browser: markierter Text + execCommand
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove(); $("q").focus();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(fallback);
  else fallback();
}

async function say(text, from) {
  text = text.trim();
  const raw = text, literal = text.startsWith(">"); // führendes ">": nicht übersetzen, in der Quellsprache sprechen (ohne ">")
  if (literal) text = text.slice(1).trim();
  if (!text) return;
  const to = $("dst").value, id = ++speaking;
  lastSaid = { text: raw, from };
  try { await api("POST", { text, lang: from }); reload(); } catch { dbError(); } // Satz muss existieren, bevor die Übersetzung daran hängt
  $("status").textContent = "";
  $("out").innerHTML = "";
  let out = text, cached = false;
  try {
    if (!literal && !text.endsWith("!!")) // zwei Rufzeichen am Ende: unübersetzt, wörtlich sprechen
      ({ text: out, cached } = await translate(text, from, to));
  } catch (e) {
    if (id !== speaking) return;
    $("status").textContent = t("error", e.message);
  }
  if (id !== speaking) return;
  const spokenLang = out === text ? from : to;
  // Unverändertes Ergebnis: Original nicht extra zeigen, nur den gesprochenen Satz
  const translated = out !== text;
  $("out").innerHTML = (translated ? `<div class="muted"></div>` : "") + `<div class="tr"></div>`;
  if (translated) $("out").firstChild.textContent = `${from === to ? t("orig") : LANGS[from]}: ${text}` + (cached ? t("cached") : "");
  $("out").lastChild.textContent = out;
  speak(out, spokenLang);
  copyText(out);
  // Japanisch/Russisch/Chinesisch: Umschrift nachladen und unter den gesprochenen Satz setzen (beim Original an die graue Zeile hängen)
  if (ROMAN.has(spokenLang)) romaji(out, spokenLang).then(r => {
    if (!r || id !== speaking) return;
    $("out").append(Object.assign(document.createElement("div"), { className: "romaji", textContent: r }));
  });
  if (translated && ROMAN.has(from)) romaji(text, from).then(r => {
    if (!r || id !== speaking || !$("out").firstChild) return;
    $("out").firstChild.textContent += " (" + r + ")";
  });
}

// ---------- UI ----------
// Anzeigetext eines Eintrags in der Eingabesprache: Original, sonst gespeicherte Übersetzung (fehlt sie: null)
const shown = e => e.lang === $("src").value ? e.text : e.translations?.[$("src").value] ?? null;
function renderList(el, items, selIdx, inSrc = false) {
  el.replaceChildren(...items.map((e, i) => {
    const li = document.createElement("li");
    if (i === selIdx) li.className = "sel";
    const a = document.createElement("span"), b = document.createElement("small");
    const txt = inSrc ? shown(e) ?? e.text : e.text;
    a.textContent = txt;
    b.textContent = (e.via && e.via !== txt ? `≈ ${e.via} · ` : "") + `${e.lang} ${e.count}×`;
    li.append(a, b);
    if (i === selIdx) li.append(Object.assign(document.createElement("kbd"), { textContent: "Tab" }));
    const del = Object.assign(document.createElement("button"), { type: "button", className: "del", textContent: "×", title: t("delete") });
    del.setAttribute("aria-label", t("delete") + ": " + e.text);
    del.onclick = ev => { ev.stopPropagation(); remove(e.text); };
    li.append(del);
    return li;
  }));
}

// ---------- Suche im Browser (Port von db.suggest): beim Tippen geht nichts an den Server ----------
// difflib.SequenceMatcher.ratio(): 2·Treffer/Länge, Treffer = längster gemeinsamer Block, dann rekursiv links und rechts davon
function matched(a, al, ah, b, bl, bh) {
  let best = 0, bi = 0, bj = 0, prev = new Array(bh - bl + 1).fill(0);
  for (let i = al; i < ah; i++) {
    const cur = new Array(bh - bl + 1).fill(0);
    for (let j = bl; j < bh; j++) if (a[i] === b[j]) {
      const k = cur[j - bl + 1] = prev[j - bl] + 1;
      if (k > best) { best = k; bi = i - k + 1; bj = j - k + 1; }
    }
    prev = cur;
  }
  if (!best) return 0;
  return best + matched(a, al, bi, b, bl, bj) + matched(a, bi + best, ah, b, bj + best, bh);
}
const ratio = (a, b) => a.length + b.length ? 2 * matched(a, 0, a.length, b, 0, b.length) / (a.length + b.length) : 1;
function fuzzy(q, text) {
  const x = text.toLowerCase();
  const best = ratio(q, x) + (x.includes(q) ? 1 : 0); // Teilstring-Treffer belohnen
  return Math.max(best, ...x.split(/\s+/).filter(Boolean).map(w => ratio(q, w)), 0);
}
function popularity(e) { // häufig (log) und kürzlich (Halbwertszeit 7 Tage) verwendet
  const age = (Date.now() - new Date(e.last_used)) / 864e5;
  return 0.1 * Math.log1p(e.count) + 0.2 * 0.5 ** (age / 7);
}
function suggest(q, n = 50) {
  q = q.trim().toLowerCase();
  if (!q) return log.slice(0, n);
  const scored = [];
  for (const e of log) {
    let f = fuzzy(q, e.text), via = null;
    for (const x of Object.values(e.translations || {})) { // Treffer in einer Übersetzung liefert das Original
      const g = fuzzy(q, x);
      if (g > f) { f = g; via = x; }
    }
    if (f > 0.4) scored.push([f + popularity(e), via ? { ...e, via } : e]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, n).map(r => r[1]);
}
// Fehlende Übersetzungen in die Eingabesprache nachladen (Datenbank, sonst Google; translate() speichert sie und lädt neu)
const tried = new Set();
function fillMissing() {
  const to = $("src").value;
  for (const e of sugg.slice(0, 10)) {
    const k = e.text + "\n" + to;
    if (shown(e) !== null || tried.has(k)) continue;
    tried.add(k);
    translate(e.text, e.lang, to).then(r => { if (shown(e) === null) { (e.translations ||= {})[to] = r.text; refresh(); } }).catch(() => {});
  }
}
function refresh() {
  sugg = suggest($("q").value);
  sel = Math.min(sel, Math.max(sugg.length - 1, 0));
  renderList($("sugg"), sugg, sel, true);
  fillMissing();
  [...$("sugg").children].forEach((li, i) => li.onclick = () => fill(sugg[i]));
}

function renderLog() {
  $("hcount").textContent = log.length;
  renderList($("log"), log.slice(0, 15), -1);
  [...$("log").children].forEach((li, i) => li.onclick = () => take(i, log[i]));
}

function remove(text) {
  api("DELETE", null, API + "?text=" + encodeURIComponent(text)).then(reload).catch(dbError);
}

function take(i, e = sugg[i]) {
  if (!e) return;
  $("q").value = "";
  sel = 0;
  say(e.text, e.lang);
}

// Tab/Tippen übernimmt den Vorschlag ins Textfeld, zweites Tab/Tippen innerhalb von 0,5 s sendet
let lastFill = 0;
function fill(e = sugg[sel]) {
  if (!e) return;
  const now = Date.now(), twice = now - lastFill < 500 && $("q").value.trim();
  lastFill = now;
  if (twice) { lastFill = 0; go(); return; }
  if (shown(e) === null) { // noch nicht in der Eingabesprache vorhanden: erst übersetzen (Eingabesprache bleibt unverändert)
    const to = $("src").value;
    translate(e.text, e.lang, to).then(r => { (e.translations ||= {})[to] = r.text; lastFill = 0; fill(e); }).catch(() => {});
    return;
  }
  const txt = shown(e);
  const q = $("q");
  q.value = txt;
  q.focus();
  q.setSelectionRange(txt.length, txt.length);
  sel = 0;
  refresh();
}

$("q").addEventListener("input", () => { sel = 0; refresh(); });
// Tastatur global, damit ↑/↓/Tab auch funktionieren, wenn der Fokus nicht im Eingabefeld liegt
function move(d) {
  sel = Math.min(Math.max(sel + d, 0), sugg.length - 1);
  renderList($("sugg"), sugg, sel, true);
  $("sugg").children[sel]?.scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  const t = e.target.tagName;
  if (t === "SELECT" || e.target.type === "range" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Tab" && sugg.length) { e.preventDefault(); fill(); }
  else if (e.key === "Enter" && t !== "BUTTON") go();
  else if (e.key === "Escape") { // laufende Wiedergabe stoppen, sonst Feld leeren
    if (helpStop()) return; // Anleitung wird vorgelesen: nur das beenden
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    speaking++; // noch ausstehende Übersetzung nicht mehr sprechen
    speechSynthesis.cancel();
    if (audio) { stopAudio(); return; }
    if (!busy) { $("q").value = ""; sel = 0; refresh(); }
  }
  else if (e.key.length === 1 && t !== "INPUT") $("q").focus(); // Tippen landet im Eingabefeld
});

function go() {
  const t = $("q").value;
  $("q").value = "";
  sel = 0;
  say(t, $("src").value);
}
$("go").onclick = () => { go(); $("q").focus(); };

$("clear").onclick = () => { if (!confirm(t("confirm_clear"))) return; api("DELETE").then(() => { log = []; renderLog(); refresh(); }).catch(dbError); };
$("export").onclick = () => {
  // eine Spalte je Sprache mit der gespeicherten Übersetzung (leer, wenn es keine gibt); Tabs/Zeilenumbrüche im Text würden die Spalten verschieben
  const cell = x => String(x ?? "").replace(/[\t\r\n]+/g, " "), codes = Object.keys(LANGS);
  const txt = [["first_used", "last_used", "count", "lang", "text", ...codes.map(c => "tr_" + c)],
    ...log.map(e => [e.first_used, e.last_used, e.count, e.lang, e.text, ...codes.map(c => e.translations?.[c])])]
    .map(r => r.map(cell).join("\t")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
  a.download = "talk4me-log.tsv";
  a.click();
};

// Stimmenwahl je Zielsprache: erst Sprache, dann die dazu gefundenen Stimmen
let voiceChoice = {};
try { voiceChoice = JSON.parse(localStorage.getItem("talk4me.voices")) || {}; } catch {}
for (const [c, n] of Object.entries(LANGS)) $("vlang").add(new Option(n, c));
$("vlang").value = $("dst").value;
function fillVoices() {
  const l = $("vlang").value, sel = $("voice");
  const vs = voicesFor(l)
    .sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
  sel.length = 0;
  sel.add(new Option(t("auto") + (piper[l] ? " · Piper" : ""), ""));
  for (const v of vs) sel.add(new Option(`${v.name} (${v.lang})`, v.voiceURI));
  sel.value = voiceChoice[l] || ""; if (sel.value !== (voiceChoice[l] || "")) sel.value = "";
  $("vcount").textContent = t("found", vs.length);
  fillVoiceMenu(vs);
}
// Emotions-Knopf (nur bei der deutschen Piper-Männerstimme): Emoticon-Menü, danach wird der letzte Satz wiederholt
const emenu = document.createElement("div"), ebtn = document.createElement("button");
ebtn.type = "button"; ebtn.className = "pk"; ebtn.setAttribute("aria-haspopup", "listbox");
emenu.className = "pkmenu"; emenu.hidden = true; emenu.setAttribute("role", "listbox");
$("pk-emo").append(ebtn, emenu);
$("pk-emo").close = () => { emenu.hidden = true; ebtn.setAttribute("aria-expanded", "false"); };
ebtn.onclick = () => { const open = emenu.hidden; closeAll(); emenu.hidden = !open; ebtn.setAttribute("aria-expanded", String(open)); };
$("pk-emo").addEventListener("keydown", e => { if (e.key === "Escape" && !emenu.hidden) { e.stopPropagation(); $("pk-emo").close(); ebtn.focus(); } });
function fillEmotion() {
  $("pk-emo").hidden = !($("dst").value === "de" && emotionOn("de"));
  ebtn.textContent = EMOTIONS[emotion] + " ▾";
  ebtn.title = ebtn.ariaLabel = emotion;
  emenu.replaceChildren(...Object.entries(EMOTIONS).map(([k, e]) => {
    const o = document.createElement("button");
    o.type = "button"; o.setAttribute("role", "option"); o.textContent = e; o.title = k; o.ariaLabel = k;
    o.setAttribute("aria-selected", String(k === emotion));
    o.onclick = () => {
      emotion = k;
      try { localStorage.setItem("talk4me.emotion", k); } catch {}
      $("pk-emo").close(); fillEmotion(); replayLast("de"); $("q").focus();
    };
    return o;
  }));
}
// Stimmen-Knopf in der obersten Zeile: nur Stimmen der Zielsprache; Auswahl spricht den letzten Satz erneut
const vmenu = document.createElement("div"), vbtn = document.createElement("button");
vbtn.type = "button"; vbtn.className = "pk"; vbtn.textContent = "🔊 ▾"; vbtn.setAttribute("aria-haspopup", "listbox");
vmenu.className = "pkmenu"; vmenu.hidden = true; vmenu.setAttribute("role", "listbox");
$("pk-voice").append(vbtn, vmenu);
$("pk-voice").close = () => { vmenu.hidden = true; vbtn.setAttribute("aria-expanded", "false"); };
vbtn.onclick = () => { const open = vmenu.hidden; closeAll(); vmenu.hidden = !open; vbtn.setAttribute("aria-expanded", String(open)); };
$("pk-voice").addEventListener("keydown", e => { if (e.key === "Escape" && !vmenu.hidden) { e.stopPropagation(); $("pk-voice").close(); vbtn.focus(); } });
function replayLast(l) {
  const last = lastSaid || (log[0] && { text: log[0].text, from: log[0].lang }); // nach dem Laden: jüngster Satz des Verlaufs
  if (lastSpoken && lastSpoken.lang === l) speak(lastSpoken.text, l);
  else if (last) say(last.text, last.from); // andere Zielsprache oder noch nichts gesprochen: neu übersetzen und sprechen
}
function fillVoiceMenu(vs) {
  fillEmotion();
  const l = $("dst").value, g = $("gender").value;
  const cur = voiceChoice[l] || (piper[l] ? "piper:" + (piper[l].includes(g) ? g : piper[l][0]) : "");
  const items = [["", t("auto")]];
  for (const x of piper[l] || []) items.push(["piper:" + x, "Piper · " + t(x === "m" ? "male" : "female")]);
  const mine = voicesFor(l)
    .sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
  for (const v of mine) items.push([v.voiceURI, `${v.name} (${v.lang})`]);
  vbtn.title = vbtn.ariaLabel = t("voice");
  vmenu.replaceChildren(...items.map(([val, label]) => {
    const o = document.createElement("button");
    o.type = "button"; o.setAttribute("role", "option"); o.textContent = label;
    o.setAttribute("aria-selected", String(val === cur || (!cur && val === "")));
    o.onclick = () => {
      if (val.startsWith("piper:")) { $("gender").value = val.slice(6); voiceChoice[l] = ""; }
      else voiceChoice[l] = val;
      try { localStorage.setItem("talk4me.voices", JSON.stringify(voiceChoice)); localStorage.setItem("talk4me.gender", $("gender").value); } catch {}
      $("pk-voice").close(); fillVoices();
      replayLast(l);
      $("q").focus();
    };
    return o;
  }));
}
$("vlang").onchange = fillVoices;
$("voice").onchange = () => {
  voiceChoice[$("vlang").value] = $("voice").value;
  try { localStorage.setItem("talk4me.voices", JSON.stringify(voiceChoice)); } catch {}
};
speechSynthesis.onvoiceschanged = fillVoices; // Stimmenliste lädt asynchron
fillVoices();

// ---------- Bedienungsanleitung: Absätze anzeigen und absatzweise vorlesen (Esc oder ⏹ beendet) ----------
let helpRun = 0, helpAudio = null; // helpRun: Nummer des laufenden Vorlesens, 0 = keines
function helpStop() {
  const was = helpRun > 0;
  helpRun = 0;
  speechSynthesis.cancel();
  if (helpAudio) { helpAudio.pause(); helpAudio = null; }
  $("hstop").hidden = true;
  for (const p of $("helptext").children) p.classList.remove("now");
  return was;
}
function helpRead() {
  helpStop();
  speechSynthesis.cancel(); stopAudio();
  $("help").open = true;
  const run = helpRun = Date.now(), ps = [...$("helptext").children], lang = ui;
  $("hstop").hidden = false;
  const next = i => {
    if (run !== helpRun) return;
    ps.forEach((p, k) => p.classList.toggle("now", k === i));
    if (i >= ps.length) { helpStop(); return; }
    ps[i].scrollIntoView({ block: "nearest" });
    const text = ps[i].textContent, go = () => next(i + 1);
    if (piper[lang] && !voiceChoice[lang]) {
      const a = helpAudio = new Audio("/api/tts?" + new URLSearchParams({ text, lang, gender: $("gender").value, rate: $("rate").value / 100 }));
      a.onended = go;
      a.onerror = () => { helpAudio = null; browser(); };
      a.play().catch(() => { helpAudio = null; browser(); });
    } else browser();
    function browser() {
      if (run !== helpRun) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = BCP47[lang]; u.rate = $("rate").value / 100;
      const v = pickVoice(lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.onend = u.onerror = go;
      speechSynthesis.speak(u);
    }
  };
  next(0);
}
$("hspeak").onclick = helpRead;
$("hstop").onclick = helpStop;

// ---------- Anmeldung: Zustände login | register | sent | set (Passwort nach dem Link aus der E-Mail) ----------
let authState = null, verifyToken = new URLSearchParams(location.search).get("verify"), acctEmail = null;
if (verifyToken) history.replaceState(null, "", location.pathname);
const authPost = (path, body) => rawFetch(path, { method: "POST", body: JSON.stringify(body) });
function showAuth(state, msg = "", ok = false) {
  if (authState === "set" && state === "login") return; // Link aus der E-Mail hat Vorrang vor dem Anmeldeformular
  authState = state;
  $("auth").hidden = false;
  const email = state === "login" || state === "register", pw = state === "login" || state === "set";
  $("atitle").textContent = t({ login: "signin", register: "reg_title", sent: "reg_title", set: "set_title" }[state]);
  $("aintro").hidden = !(state === "register" || state === "set");
  $("aintro").textContent = t(state === "set" ? "pw_hint" : "reg_intro");
  $("aemail").hidden = !email; $("aemail").placeholder = t("email");
  $("apw").hidden = !pw; $("apw").placeholder = t("password");
  $("apw").autocomplete = state === "set" ? "new-password" : "current-password";
  $("apw2").hidden = state !== "set"; $("apw2").placeholder = t("password2"); $("apw2").value = "";
  $("asubmit").hidden = state === "sent";
  $("asubmit").textContent = t({ login: "signin", register: "send_link", set: "create" }[state] || "signin");
  $("amsg").textContent = state === "sent" ? t("mail_sent") : msg;
  $("amsg").className = state === "sent" || ok ? "ok" : "";
  const l1 = $("alink1"), l2 = $("alink2");
  l1.hidden = l2.hidden = false;
  if (state === "login") { l1.textContent = t("noaccount"); l1.onclick = e => (e.preventDefault(), showAuth("register")); l2.textContent = t("forgot"); l2.onclick = l1.onclick; }
  else { l1.textContent = t("back"); l1.onclick = e => (e.preventDefault(), showAuth("login")); l2.hidden = true; }
  (email ? $("aemail") : $("apw")).focus();
}
$("authform").onsubmit = async e => {
  e.preventDefault();
  const email = $("aemail").value.trim(), pw = $("apw").value;
  try {
    if (authState === "register") {
      const r = await authPost("/api/register", { email, lang: ui });
      r.ok ? showAuth("sent") : showAuth("register", t(r.status === 429 ? "too_many" : "bad_email"));
    } else if (authState === "set") {
      if (pw.length < 8) return showAuth("set", t("pw_hint"));
      if (pw !== $("apw2").value) return showAuth("set", t("pw_mismatch"));
      const r = await authPost("/api/verify", { token: verifyToken, password: pw });
      if (r.ok) location.reload(); else { verifyToken = null; authState = null; showAuth("login", t("bad_link")); }
    } else {
      const r = await authPost("/api/login", { email, password: pw });
      if (r.ok) location.reload(); else showAuth("login", t(r.status === 429 ? "too_many" : "bad_login"));
    }
  } catch { showAuth(authState, t("dberr")); }
};
$("logout").onclick = $("logouttop").onclick = () => authPost("/api/logout", {}).then(() => location.reload());
function showWho() {
  $("whotop").hidden = !acctEmail; $("whotop").textContent = $("whotop").title = acctEmail || "";
  $("logouttop").hidden = !acctEmail; $("logouttop").title = $("logouttop").ariaLabel = t("logout");
  $("acct").hidden = !acctEmail; $("who").textContent = acctEmail ? t("signed_in", acctEmail) : ""; }
for (const [c, n] of Object.entries(LANGS)) $("alang").add(new Option(n, c));
$("alang").onchange = () => { ui = $("alang").value; try { localStorage.setItem("talk4me.ui", ui); } catch {} applyI18n(); };
rawFetch("/api/me").then(r => r.ok ? r.json() : r.status === 401 ? showAuth("login") : null).then(j => { if (j?.auth) { acctEmail = j.email; showWho(); } }).catch(() => {});
if (verifyToken) showAuth("set");

// ---------- Oberflächensprache und Design ----------
function applyI18n() {
  $("alang").value = ui; showWho();
  if (!$("auth").hidden) showAuth(authState); // Anmeldeformular in der neuen Sprache
  helpStop();
  $("helptext").replaceChildren(...t("help_body").split("\n\n").map(x => Object.assign(document.createElement("p"), { textContent: x })));
  $("hspeak").title = $("hspeak").ariaLabel = t("help_read");
  $("hstop").title = $("hstop").ariaLabel = t("help_stop");
  document.documentElement.lang = ui;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
  for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  $("status").textContent = "";
  fillVoices();
  showTheme();
}
function picker(id, sel, key) {
  const root = $(id), btn = document.createElement("button"), menu = document.createElement("div");
  btn.type = "button"; btn.className = "pk"; btn.dataset.i18nAria = key; btn.setAttribute("aria-haspopup", "listbox");
  menu.className = "pkmenu"; menu.hidden = true; menu.setAttribute("role", "listbox");
  const show = () => {
    btn.innerHTML = flagSvg(sel.value) + "▾";
    btn.title = LANGS[sel.value];
    for (const o of menu.children) o.setAttribute("aria-selected", o.dataset.lang === sel.value);
  };
  const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  for (const [c, n] of Object.entries(LANGS)) {
    const o = document.createElement("button");
    o.type = "button"; o.dataset.lang = c; o.setAttribute("role", "option"); o.innerHTML = flagSvg(c) + n;
    o.onclick = () => { sel.value = c; sel.onchange && sel.onchange(); show(); close(); $("q").focus(); };
    menu.append(o);
  }
  btn.onclick = () => { const open = menu.hidden; closeAll(); menu.hidden = !open; btn.setAttribute("aria-expanded", String(open)); };
  root.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { e.stopPropagation(); close(); btn.focus(); } });
  root.append(btn, menu);
  root.close = close;
  show();
}
const closeAll = () => document.querySelectorAll(".picker").forEach(r => r.close && r.close());
document.addEventListener("click", e => { if (!e.target.closest(".picker")) closeAll(); });
picker("pk-src", $("src"), "src");
picker("pk-dst", $("dst"), "dst");
picker("pk-ui", { get value() { return ui; }, set value(c) { ui = c; }, onchange() { try { localStorage.setItem("talk4me.ui", ui); } catch {} applyI18n(); } }, "uilang");
const dark = () => ({ dark: true, light: false })[document.documentElement.dataset.theme] ?? matchMedia("(prefers-color-scheme: dark)").matches;
function showTheme() { // zeigt das Ziel des Umschaltens
  $("theme").textContent = dark() ? "☀️" : "🌙";
  $("theme").title = $("theme").ariaLabel = t(dark() ? "theme_light" : "theme_dark");
}
try { const th = localStorage.getItem("talk4me.theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
$("theme").onclick = () => {
  const th = dark() ? "light" : "dark";
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem("talk4me.theme", th); } catch {}
  showTheme();
};
matchMedia("(prefers-color-scheme: dark)").onchange = showTheme;
applyI18n();
</script>
</body>
