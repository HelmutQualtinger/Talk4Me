services:
  talk4me:
    build: .
    image: talk4me
    container_name: talk4me
    restart: unless-stopped
    user: root                  # ./data gehört root auf dem Host; das Image-Standardbenutzer (uid 1000) könnte dort nicht schreiben
    ports:
      - "127.0.0.1:8765:8765"   # nur lokal erreichbar; von außen über den Reverse-Proxy (mit TALK4ME_AUTH=1 braucht die API ein Konto)
    environment:                # Werte aus .env (siehe .env.example); ohne TALK4ME_AUTH=1 gibt es keine Konten
      TALK4ME_AUTH: ${TALK4ME_AUTH:-0}
      TALK4ME_BASE_URL: ${TALK4ME_BASE_URL:-}
      TALK4ME_ADOPT_EMAIL: ${TALK4ME_ADOPT_EMAIL:-}
      TALK4ME_SMTP_HOST: ${TALK4ME_SMTP_HOST:-}
      TALK4ME_SMTP_PORT: ${TALK4ME_SMTP_PORT:-587}
      TALK4ME_SMTP_USER: ${TALK4ME_SMTP_USER:-}
      TALK4ME_SMTP_PASSWORD: ${TALK4ME_SMTP_PASSWORD:-}
      TALK4ME_SMTP_FROM: ${TALK4ME_SMTP_FROM:-}
    volumes:
      - ./data:/data            # SQLite-Datenbank (dieselbe wie beim lokalen Start)
      - ./voices:/voices        # Piper-Stimmen (~800 MB), fehlende lädt der Server beim Start nach
    networks:
      - reverse-proxy           # NPM erreicht den Container per Name: talk4me:8765

networks:
  reverse-proxy:
    external: true
    name: reverse-proxy
